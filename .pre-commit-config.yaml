default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.12.0
    hooks:
      - id: air-format

  - repo: local
    hooks:
      # jarl-pre-commit builds a wheel from source and fails on Windows, so run
      # the released jarl through uvx (pinned to the version CI uses).
      - id: jarl-check
        name: jarl check
        entry: uvx --from jarl-linter==0.6.0 jarl check .
        language: system
        files: \.(R|r|Rmd|rmd)$
        pass_filenames: false
