title: exuber
url: https://kvasilopoulos.github.io/exuber


template:
  bootstrap: 5
  params:
    ganalytics: UA-129604855-4
    bootswatch: cosmo

authors:
  Kostas Vasilopoulos:
    href: https://kvasilopoulos.com/
  Efthymios Pavlidis:
    href: https://sites.google.com/site/etpavlidis/
  Enrique Martínez-García:
    href: https://sites.google.com/view/emgeconomics

reference:

  - title: Package
    contents:
      - exuber

  - title: Recursive Augmented Dickey Fuller
    desc: >
      Estimation & Critical Values
    contents:
      - radf
      - radf_mc_cv
      - radf_wb_cv
      - radf_wb_cv2
      - radf_sb_cv
      - radf_crit

  - title: Heteroskedasticity-robust (time-transformed)
    desc: >
      Bootstrap-free alternative to radf_wb_cv() under time-varying volatility
    contents:
      - radf_tt
      - radf_tt_cv

  - title: Volatility-robust (other routes)
    desc: >
      Further tests robust to time-varying innovation variance; see
      docs/enhancements/volatility-robustness.md
    contents:
      - radf_sbz_cv
      - radf_kp
      - radf_sign
      - radf_sign_cv
      - radf_ssu
      - radf_svadf

  - title: Dating and root inference
    desc: >
      Start/end/recovery dates and confidence intervals on the explosive
      root; see docs/enhancements/dating-and-root-inference.md
    contents:
      - explosive_root
      - root_ci
      - root_ci_datestamp
      - radf_pdc
      - radf_recovery
      - radf_recovery_cv
      - radf_hls
      - radf_hlw
      - radf_knp

  - title: Real-time monitoring
    desc: >
      Sequential/real-time bubble detection; see docs/enhancements/monitoring.md
    contents:
      - radf_monitor
      - radf_cusum
      - radf_lbi
      - radf_lbi_monitor

  - title: Multivariate / panel bubble tests
    desc: >
      Panel and cross-series tests; see docs/enhancements/multivariate.md
    contents:
      - radf_common
      - radf_common_cv
      - radf_cobubble
      - radf_contagion

  - title: Alternative paradigms
    desc: >
      Non-ADF-family approaches; see docs/enhancements/alternative-paradigms.md
    contents:
      - radf_quantile
      - radf_qpwy

  - title: Analysis
    contents:
      - summary.radf_obj
      - diagnostics
      - datestamp

  - title: Tidying
    contents:
      - tidy.radf_obj
      - tidy.radf_cv
      - tidy.radf_distr
      - tidy.ds_radf


  - title: Plotting
    contents:
      - autoplot.radf_obj
      - autoplot.radf_distr
      - autoplot.ds_radf
      - scale_exuber_manual

  - title: Simulation
    contents:
      - sim_psy1
      - sim_psy2
      - sim_ps1
      - sim_blan
      - sim_evans
      - sim_div

  - title: Helpers
    contents:
      - psy_minw
      - psy_ds
      - index
      - series_names
      - ps_tb

  - title: Extra tidying methods
    contents:
      - tidy_join
      - tidy_join.radf_obj

articles:
- title: All Articles
  navbar: ~
  contents:
  - simulation
  - plotting
  - radf-tt
