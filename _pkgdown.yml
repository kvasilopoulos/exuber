title: exuber
url: https://kvasilopoulos.github.io/exuber

template:
  bootstrap: 5
  light-switch: true
  # Rd \eqn/\deqn reach the reference pages as raw \(..\)/$$..$$ text; the
  # default "mathml" only converts pandoc-built pages, so nothing would
  # render them. katex renders both (auto-render.js + katex-auto.js).
  math-rendering: katex
  bslib:
    preset: flatly
    primary: "#1b4b91"
    danger: "#d7263d"
    base_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    font_scale: 0.85

navbar:
  structure:
    right: [search, cran, github, lightswitch]
  components:
    cran:
      icon: fa-box
      href: https://cran.r-project.org/package=exuber
      aria-label: CRAN

footer:
  structure:
    left: [developed_by, license]
    right: built_with
  components:
    license: "&middot; License: GPL-3"

authors:
  Kostas Vasilopoulos:
    href: https://kvasilopoulos.com/
  Efthymios Pavlidis:
    href: https://sites.google.com/site/etpavlidis/
  Enrique Martínez-García:
    href: https://sites.google.com/view/emgeconomics

reference:
  - title: Package
    contents:
      - exuber
      - exuber_functions

  - title: Recursive Augmented Dickey-Fuller
    desc: >
      Estimation and critical values, the core of the package. Each function
      is listed with the methods that consume its output.
  - subtitle: radf()
    contents:
      - radf
      - summary.radf_obj
      - tidy.radf_obj
      - augment.radf_obj
      - autoplot.radf_obj
  - subtitle: Critical values
    desc: >
      One engine per null distribution; each `_cv()` has a `_distr()` twin
      that returns the full simulated distribution instead of its quantiles
    contents:
      - radf_mc_cv
      - radf_wb_cv
      - radf_wb_ps_cv
      - radf_sb_cv
      - tidy.radf_cv
      - augment.radf_cv
      - tidy.radf_distr
      - autoplot.radf_distr
  - subtitle: Joining statistics and critical values
    contents:
      - tidy_join
      - tidy_join.radf_obj
      - augment_join
      - augment_join.radf_obj

  - title: Analysis
    desc: >
      The core workflow, in order: check which series reject the null, date
      the explosive episodes, and then measure how fast each one is growing.
  - subtitle: diagnostics()
    contents:
      - diagnostics
  - subtitle: datestamp()
    contents:
      - datestamp
      - tidy.ds_radf
      - autoplot.ds_radf
  - subtitle: rootstamp()
    contents:
      - rootstamp
      - autoplot.rootstamp_est
      - autoplot.rootstamp_episodes

  - title: Heteroskedasticity-robust (time-transformed)
    desc: >
      An alternative to radf_wb_cv() under time-varying volatility that needs
      no bootstrap.
    contents:
      - radf_tt
      - radf_tt_cv

  - title: Volatility-robust (other routes)
    desc: >
      Further tests that remain valid when the innovation variance changes
      over time. See docs/volatility-robustness.md.
  - subtitle: radf_sbz()
    contents:
      - radf_sbz
      - radf_sbz_cv
      - radf_sbz_union
      - autoplot.radf_sbz_union_obj
  - subtitle: radf_sign()
    contents:
      - radf_sign
      - radf_sign_cv
      - radf_sign_dm
      - radf_sign_dm_cv
  - subtitle: ssu_test()
    contents:
      - ssu_test
      - autoplot.ssu_test_obj
  - subtitle: cusum_test()
    contents:
      - cusum_test
      - autoplot.cusum_test_obj
  - subtitle: radf_kp()
    contents:
      - radf_kp

  - title: Dating procedures
    desc: >
      Standalone dating procedures that need no critical value, and recovery
      dating. See docs/dating-and-root-inference.md. rootstamp() is listed
      under Analysis above because it is the last step of the core workflow
      and not an alternative to datestamp().
  - subtitle: dating_pdc()
    contents:
      - dating_pdc
      - autoplot.dating_pdc_obj
  - subtitle: dating_hls()
    contents:
      - dating_hls
      - autoplot.dating_hls_obj
  - subtitle: dating_hlw()
    contents:
      - dating_hlw
      - autoplot.dating_hlw_obj
  - subtitle: dating_knp()
    contents:
      - dating_knp
      - autoplot.dating_knp_obj
  - subtitle: radf_recovery()
    contents:
      - radf_recovery
      - radf_recovery_cv
      - autoplot.radf_recovery_obj

  - title: Real-time monitoring
    desc: >
      Sequential, real-time bubble detection. See docs/monitoring.md. Each
      monitor is listed with its static, full-sample counterpart where one
      exists.
  - subtitle: monitor()
    contents:
      - monitor
      - autoplot.monitor_obj
  - subtitle: monitor_cusum()
    contents:
      - monitor_cusum
      - autoplot.monitor_cusum_obj
  - subtitle: monitor_lbi()
    contents:
      - monitor_lbi
      - autoplot.monitor_lbi_obj
      - lbi_test
      - autoplot.lbi_test_obj
  - subtitle: monitor_quantile()
    contents:
      - monitor_quantile
      - autoplot.monitor_quantile_obj
      - quantile_test
      - autoplot.quantile_test_obj

  - title: Multivariate / panel bubble tests
    desc: >
      Panel and cross-series tests. See docs/multivariate.md.
  - subtitle: radf_common()
    contents:
      - radf_common
      - radf_common_cv
  - subtitle: cobubble_test()
    contents:
      - cobubble_test
      - autoplot.cobubble_test_obj
  - subtitle: contagion_reg()
    contents:
      - contagion_reg
      - autoplot.contagion_reg_obj

  - title: Simulation
  - subtitle: Original DGPs
    contents:
      - sim_psy1
      - sim_psy2
      - sim_ps1
      - sim_blan
      - sim_evans
      - sim_div
  - subtitle: Additional DGPs
    desc: >
      Data generating processes for cases that the original sim_*()
      functions of exuber do not cover: time-varying volatility, non-Gaussian
      innovations, long memory, and distinct multi-series and branching
      mechanisms. See docs/simulation-dgps.md.
    contents:
      - sim_innov
      - sim_vol_break
      - sim_vol_garch
      - sim_vol_cir
      - sim_vol_sv
      - sim_fi
      - sim_common
      - sim_coexplosive
      - sim_tree
      - sim_mar
      - sim_msbubble
      - sim_falsebubble
  - subtitle: Bundled data
    contents:
      - sim_data

  - title: Helpers
    contents:
      - psy_minw
      - psy_ds
      - index
      - series_names
      - ps_tb
      - scale_exuber_manual

# "exuber" (vignettes/exuber.Rmd) is pkgdown's auto-detected "Get started"
# vignette (it matches the package name). The navbar links to it directly,
# and we leave it out of the groups below so that it is not listed twice.
articles:
  - title: Core workflow
    navbar: ~
    desc: >
      Beyond "Get started": the naming conventions, plotting, and the
      simulated data used throughout the other articles.
    contents:
      - naming-and-analysis
      - plotting
      - simulation

  - title: Robust alternatives to radf() itself
    navbar: ~
    desc: >
      These articles still ask whether there is a bubble, under assumptions
      that plain radf() does not cover (time-varying volatility and
      alternative test statistics).
    contents:
      - radf-tt
      - volatility-robust-radf
      - alternative-tests

  - title: Dating, monitoring & root inference
    navbar: ~
    desc: >
      Beyond plain datestamp(): alternative dating procedures, real-time
      monitoring, and how fast a detected bubble is growing.
    contents:
      - dating-methods
      - monitoring
      - root-inference

  - title: Multivariate & experimental
    navbar: ~
    desc: >
      Relationships across series, and methods that fall short of the usual
      validation standard of this package (see the caveats in each article).
    contents:
      - co-explosivity
      - experimental-methods
